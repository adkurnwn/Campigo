services:
  app:
    image: adkurnwn/campigo:dev-actions-${IMAGE_TAG:-latest}
    container_name: campigo-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: Campigo
      APP_ENV: production  
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-campigo}
      DB_USERNAME: ${DB_USERNAME:-campigo_user}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@campigo.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Campigo}
    volumes:
      - app-storage:/var/www/storage
      - app-public:/var/www/public
      - app-logs:/var/www/storage/logs
    networks:
      - campigo
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:alpine
    container_name: campigo-webserver
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - app-public:/var/www/public:ro
      - app-storage:/var/www/storage:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites/:/etc/nginx/sites-available/:ro
      - ./docker/nginx/ssl/:/etc/ssl/:ro
    depends_on:
      - app
    networks:
      - campigo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: campigo-db
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-campigo}
      MYSQL_USER: ${DB_USERNAME:-campigo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - campigo-db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
      - ./backups/mysql:/backups
    networks:
      - campigo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

volumes:
  campigo-db-data:
    driver: local
  app-storage:
    driver: local
  app-public:
    driver: local
  app-logs:
    driver: local

networks:
  campigo:
    driver: bridge